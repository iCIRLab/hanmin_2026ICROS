cm_seed:
  label: lateral_nullspace_forward_facing_cm
  role: 운반 시작 전 CM 기반 초기 자세 seed
  query_scope: offline selected seed; 운반 중 event-based requery는 수행하지 않음
  score_definition:
    note: 선행연구의 mu-F-B 평가 틀을 협업 운반 문제에 맞게 재정의한 score
    main_terms:
      mu_norm: 팔 조작성
      formation_score: leader/follower grasp 관계 유지
      base_score: attach 위치 대비 base displacement penalty
    diagnostic_terms:
      joint_margin: 관절 한계 여유
      torque_margin: torque 여유
      lateral_y_q24_norm: y-방향 조작성
      seed_shape_score: q1/q3 보상 형태
  mode235_policy:
    priority_0: [joint_bounds, wheel_bounds]
    priority_1: [base_trajectory, ee_z_orientation_stability, posture_reference]
    ee_mask: [0, 0, 1, 1, 1, 1]

